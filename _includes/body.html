<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/image.png' | relative_url }}" alt="Infor Mayo" width="44" height="44">
      <span class="brand-text">
        <strong>Infor Mayo</strong>
        <small>Tecnología práctica para Cuba</small>
      </span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Navegación principal">
      <ul>
        <li><a href="{{ '/' | relative_url }}">Inicio</a></li>
        <li class="has-sub">
          <button class="sub-toggle" type="button" aria-expanded="false">Acerca de</button>
          <ul class="submenu">
            <li><a href="{{ '/acercade.html' | relative_url }}">Quiénes somos</a></li>
            <li><a href="{{ '/equipo.html' | relative_url }}">Nuestro equipo</a></li>
            <li><a href="{{ '/historia.html' | relative_url }}">Nuestra historia</a></li>
          </ul>
        </li>
        <li><a href="{{ '/productos.html' | relative_url }}">Productos</a></li>
        <li class="has-sub">
          <button class="sub-toggle" type="button" aria-expanded="false">Cursos</button>
          <ul class="submenu">
            <li><a href="{{ '/cursos.html' | relative_url }}">Todos los cursos</a></li>
            <li><a href="{{ '/cursos/c++_basico/1-curso-basico-c++.html' | relative_url }}">C++ básico</a></li>
            <li><a href="{{ '/cursos/python_basico/1-curso-basico-python.html' | relative_url }}">Python básico</a></li>
            <li><a href="{{ '/cursos/transfermovil/curso-completo-transfermovil.html' | relative_url }}">Transfermóvil</a></li>
            <li><a href="{{ '/cursos/QT/curso-completo-QT.html' | relative_url }}">Qt</a></li>
          </ul>
        </li>
        <li><a href="{{ '/contacto.html' | relative_url }}">Contacto</a></li>
      </ul>
    </nav>

    <a class="btn btn-primary header-cta" href="https://www.youtube.com/channel/UC91YVQo46w3z1ZZJH-5tb5Q?sub_confirmation=1" target="_blank" rel="noopener">Suscríbete</a>
  </div>
</header>

<script>
  (function () {
    var toggle = document.querySelector('.nav-toggle');
    var nav = document.getElementById('site-nav');

    if (toggle && nav) {
      toggle.addEventListener('click', function () {
        var open = nav.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.setAttribute('aria-label', open ? 'Cerrar menú' : 'Abrir menú');
      });
    }

    document.querySelectorAll('.sub-toggle').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var li = btn.parentElement;
        var open = li.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    });

    if (nav) {
      nav.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () {
          if (window.matchMedia('(max-width: 900px)').matches) {
            nav.classList.remove('open');
            if (toggle) {
              toggle.setAttribute('aria-expanded', 'false');
              toggle.setAttribute('aria-label', 'Abrir menú');
            }
          }
        });
      });
    }
  })();
</script>
